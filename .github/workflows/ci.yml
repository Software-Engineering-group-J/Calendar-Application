
name: Frontend CI/CD Pipeline

on:
  push:
    branches: [frontendCDpipeline]
  pull_request:
    branches: [frontendCDpipeline]

permissions:
  contents: read

jobs:
  frontend:
    name: Build and test frontend
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build React application
        run: npm run build

      - name: Run frontend tests
        run: npm run test:run

  deploy:
    name: Deploy frontend to AWS Amplify
    needs: frontend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Start Amplify deployment
        id: amplify
        run: |
          JOB_ID=$(aws amplify start-job \
            --app-id d24s67ki04sunq \
            --branch-name main \
            --job-type RELEASE \
            --query 'jobSummary.jobId' \
            --output text)
          echo "job-id=$JOB_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for Amplify deployment
        env:
          JOB_ID: ${{ steps.amplify.outputs.job-id }}
        run: |
          while true; do
            STATUS=$(aws amplify get-job \
              --app-id d24s67ki04sunq \
              --branch-name main \
              --job-id "$JOB_ID" \
              --query 'job.summary.status' \
              --output text)
            echo "Amplify deployment status: $STATUS"
            case "$STATUS" in
              SUCCEED) exit 0 ;;
              FAILED|CANCELLED) exit 1 ;;
              *) sleep 15 ;;
            esac
          done
