
name: Frontend CI/CD Pipeline

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read

jobs:
  frontend:
    name: Build and test frontend
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build React application
        run: npm run build

      - name: Run frontend tests
        run: npm run test:run

  production:
    name: Verify Amplify production deployment
    needs: frontend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 55

    permissions:
      contents: read
      id-token: write
      deployments: write

    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Wait for matching Amplify job
        id: find-job
        shell: bash
        env:
          APP_ID: ${{ vars.AMPLIFY_APP_ID }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          echo "Waiting for Amplify to register commit $GITHUB_SHA"

          for attempt in $(seq 1 60); do
            JOB_ID=$(aws amplify list-jobs \
              --app-id "$APP_ID" \
              --branch-name main \
              --max-results 50 \
              --output json |
              jq -r --arg sha "$GITHUB_SHA" \
              '[.jobSummaries[] | select(.commitId == $sha)]
              | sort_by(.startTime // 0) | last | .jobId // empty')

            if [[ -n "$JOB_ID" ]]; then
              echo "job_id=$JOB_ID" >> "$GITHUB_OUTPUT"
              echo "Found Amplify job $JOB_ID"
              exit 0
            fi

            sleep 15
          done

          echo "No Amplify job found for commit $GITHUB_SHA"
          exit 1

      - name: Wait for Amplify deployment to finish
        shell: bash
        env:
          APP_ID: ${{ vars.AMPLIFY_APP_ID }}
          JOB_ID: ${{ steps.find-job.outputs.job_id }}
        run: |
          set -euo pipefail

          for attempt in $(seq 1 120); do
            STATUS=$(aws amplify get-job \
              --app-id "$APP_ID" \
              --branch-name main \
              --job-id "$JOB_ID" \
              --query 'job.summary.status' \
              --output text)

            echo "Amplify job $JOB_ID status: $STATUS"

            case "$STATUS" in
              SUCCEED)
                echo "Amplify deployment succeeded."
                exit 0
                ;;
              FAILED|CANCELLED)
                echo "Amplify deployment ended with status: $STATUS"
                exit 1
                ;;
            esac

            sleep 15
          done

          echo "Timed out waiting for Amplify job $JOB_ID"
          exit 1
